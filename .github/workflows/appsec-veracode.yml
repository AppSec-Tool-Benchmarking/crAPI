# Benchmark scan — manual trigger only. No auto-runs, no PR decoration, no pipeline failures.
# Part of the Guidepoint AppSec Tool Benchmarking program (Phase 1).

name: "AppSec Benchmark — Veracode [crAPI]"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  veracode:
    name: Veracode Pipeline Scan
    # crAPI is a multi-language monorepo. Best-effort build: Java service + overall zip.
    # Go and Python/TypeScript services are included in the source zip.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Java services (best effort)
        run: |
          find . -name "pom.xml" -not -path "*/node_modules/*" | while read pom; do
            dir=$(dirname "$pom")
            echo "Building Maven project in $dir"
            (cd "$dir" && mvn package -DskipTests -q) || echo "Maven build failed in $dir — continuing"
          done
        continue-on-error: true

      - name: Build Go services (best effort)
        run: |
          find . -name "go.mod" -not -path "*/node_modules/*" | while read gomod; do
            dir=$(dirname "$gomod")
            echo "Building Go project in $dir"
            (cd "$dir" && go build ./...) || echo "Go build failed in $dir — continuing"
          done
        continue-on-error: true

      - name: Create results directory
        run: mkdir -p results/veracode

      - name: Zip source and compiled artifacts for Veracode
        run: zip -r results/veracode/source.zip . --exclude "*.git*" --exclude "results/*" --exclude "node_modules/*"

      - name: Run Veracode Pipeline Scan
        uses: veracode/Veracode-GitHub-Actions/pipeline-scan@v0.1.0
        continue-on-error: true
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          file: "results/veracode/source.zip"
          fail_on_severity: ""
          json_output_file: "results/veracode/veracode-results.json"

      - name: Upload Veracode results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veracode-results
          path: results/veracode/
          if-no-files-found: warn
