# Benchmark scan — manual trigger only. No auto-runs, no PR decoration, no pipeline failures.
# Part of the Guidepoint AppSec Tool Benchmarking program (Phase 1).

name: "AppSec Benchmark — Snyk [crAPI]"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-code:
    name: Snyk Code (SAST) — all projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Create results directory
        run: mkdir -p results/snyk

      - name: Run Snyk Code scan (all projects)
        run: snyk code test --all-projects --sarif-file-output=results/snyk/snyk-code.sarif --severity-threshold=low
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk Code results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-results
          path: results/snyk/

  snyk-opensource:
    name: Snyk Open Source (SCA) — all projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Create results directory
        run: mkdir -p results/snyk

      - name: Run Snyk Open Source scan (all projects)
        run: snyk test --all-projects --json-file-output=results/snyk/snyk-opensource.json --severity-threshold=low
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk Open Source results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-results
          path: results/snyk/
